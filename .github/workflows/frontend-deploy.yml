name: Deploy Frontend to Hostinger

on:
  push:
    branches: [ Demo ]
    paths: [ 'Frontend/**' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: Frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install --force --legacy-peer-deps --no-audit

      - name: Build project
        working-directory: Frontend
        run: npm run build

      - name: Verify build output
        working-directory: Frontend
        run: |
          echo "Checking build output..."
          ls -la dist/
          if [ ! -f "dist/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi
          echo "✅ Build verification completed"

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
           host: ${{ secrets.HOSTINGER_HOST }}
           username: ${{ secrets.HOSTINGER_USER }}
           key: ${{ secrets.HOSTINGER_SSH_KEY }}
           source: "Frontend/dist"
           target: "/var/www/html/Frontend/"
           strip_components: 1
           overwrite: true

      - name: Configure server and verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "Configuring server and verifying deployment..."
            
            # Check if deployment files exist
            if [ ! -f "/var/www/html/Frontend/dist/index.html" ]; then
              echo "❌ Deployment failed - index.html not found"
              echo "📁 Contents of /var/www/html/Frontend/dist:"
              ls -la /var/www/html/Frontend/dist/ || echo "Directory not found"
              exit 1
            fi
            
            echo "✅ Deployment files found"
            
            # Set proper permissions
            sudo find /var/www/html/Frontend/dist -type f -exec chmod 644 {} \;
            sudo find /var/www/html/Frontend/dist -type d -exec chmod 755 {} \;
            sudo chown -R www-data:www-data /var/www/html/Frontend/dist/
            echo "✅ Permissions set"
            
            # Detect and setup SSL certificate path
            CERT_PATH=""
            if [ -f "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" ]; then
              CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
              echo "✅ Found SSL certificate at standard path: $CERT_PATH"
            elif [ -f "/etc/letsencrypt/live/amoghconnect.com-0001/fullchain.pem" ]; then
              CERT_PATH="/etc/letsencrypt/live/amoghconnect.com-0001"
              echo "✅ Found SSL certificate at: $CERT_PATH"
              # Create symlink for easier management
              sudo ln -sf /etc/letsencrypt/live/amoghconnect.com-0001 /etc/letsencrypt/live/amoghconnect.com
              CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
              echo "✅ Created symlink to standard path"
            fi
            
            # Check if certificate is valid and includes API subdomain
            SSL_CERT_EXISTS=false
            API_SUBDOMAIN_IN_CERT=false
            if [ -n "$CERT_PATH" ] && [ -f "$CERT_PATH/fullchain.pem" ]; then
              CERT_EXPIRY=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH/fullchain.pem" 2>/dev/null | cut -d= -f2)
              if [ -n "$CERT_EXPIRY" ]; then
                CERT_EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY" +%s 2>/dev/null || echo "0")
                CURRENT_EPOCH=$(date +%s)
                if [ "$CERT_EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ]; then
                  SSL_CERT_EXISTS=true
                  echo "✅ Valid SSL certificate found (expires: $CERT_EXPIRY)"
                  
                  # Check if certificate includes api.amoghconnect.com
                  CERT_DOMAINS=$(sudo openssl x509 -in "$CERT_PATH/fullchain.pem" -text -noout 2>/dev/null | grep -E "DNS:|Subject Alternative Name" -A 10 | grep -oE "DNS:[^,]*" | sed 's/DNS://g' | tr '\n' ' ')
                  if echo "$CERT_DOMAINS" | grep -q "api.amoghconnect.com"; then
                    API_SUBDOMAIN_IN_CERT=true
                    echo "✅ Certificate includes api.amoghconnect.com"
                  else
                    echo "⚠️ Certificate does NOT include api.amoghconnect.com"
                    echo "   Certificate domains: $CERT_DOMAINS"
                  fi
                else
                  echo "⚠️ SSL certificate found but expired (expired: $CERT_EXPIRY)"
                fi
              fi
            fi
            
            # Always ensure certificate includes API subdomain - REQUIRED for HTTPS
            if [ "$SSL_CERT_EXISTS" = true ] && [ "$API_SUBDOMAIN_IN_CERT" = false ]; then
              echo "🔧 Certificate doesn't include api.amoghconnect.com - obtaining new certificate..."
              if command -v certbot >/dev/null 2>&1; then
                # Stop nginx temporarily for certbot
                sudo systemctl stop nginx
                
                # Get certificate for both domains - REQUIRED
                # Use --expand to expand existing certificate to include api subdomain
                if sudo certbot certonly --standalone -d amoghconnect.com -d api.amoghconnect.com --non-interactive --agree-tos --register-unsafely-without-email --expand 2>&1 | tee /tmp/certbot.log; then
                  echo "✅ Successfully obtained certificate for both domains"
                  
                  # Find the newest/valid certificate (check both paths)
                  NEWEST_CERT_PATH=""
                  NEWEST_CERT_EXPIRY=0
                  
                  # Check standard path
                  if [ -f "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" ]; then
                    CERT_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if [ -n "$CERT_EXPIRY_STR" ]; then
                      CERT_EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                      CURRENT_EPOCH=$(date +%s)
                      if [ "$CERT_EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ] && [ "$CERT_EXPIRY_EPOCH" -gt "$NEWEST_CERT_EXPIRY" ]; then
                        NEWEST_CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
                        NEWEST_CERT_EXPIRY=$CERT_EXPIRY_EPOCH
                        echo "   Found valid certificate at standard path (expires: $CERT_EXPIRY_STR)"
                      fi
                    fi
                  fi
                  
                  # Check -0001 path
                  if [ -f "/etc/letsencrypt/live/amoghconnect.com-0001/fullchain.pem" ]; then
                    CERT_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com-0001/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if [ -n "$CERT_EXPIRY_STR" ]; then
                      CERT_EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                      CURRENT_EPOCH=$(date +%s)
                      if [ "$CERT_EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ] && [ "$CERT_EXPIRY_EPOCH" -gt "$NEWEST_CERT_EXPIRY" ]; then
                        NEWEST_CERT_PATH="/etc/letsencrypt/live/amoghconnect.com-0001"
                        NEWEST_CERT_EXPIRY=$CERT_EXPIRY_EPOCH
                        echo "   Found valid certificate at -0001 path (expires: $CERT_EXPIRY_STR)"
                      fi
                    fi
                  fi
                  
                  # Set up symlink to point to the newest valid certificate
                  if [ -n "$NEWEST_CERT_PATH" ]; then
                    if [ "$NEWEST_CERT_PATH" != "/etc/letsencrypt/live/amoghconnect.com" ]; then
                      # Remove old directory if it's a symlink or empty
                      if [ -L "/etc/letsencrypt/live/amoghconnect.com" ]; then
                        sudo rm -f /etc/letsencrypt/live/amoghconnect.com
                      elif [ -d "/etc/letsencrypt/live/amoghconnect.com" ]; then
                        # Check if it contains expired certificate
                        if [ -f "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" ]; then
                          OLD_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" 2>/dev/null | cut -d= -f2)
                          OLD_EXPIRY_EPOCH=$(date -d "$OLD_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                          if [ "$OLD_EXPIRY_EPOCH" -lt "$CURRENT_EPOCH" ]; then
                            echo "   Removing old expired certificate directory..."
                            sudo rm -rf /etc/letsencrypt/live/amoghconnect.com
                          fi
                        fi
                      fi
                      # Create symlink to newest certificate
                      sudo ln -sf "$NEWEST_CERT_PATH" /etc/letsencrypt/live/amoghconnect.com
                      echo "   Created symlink: /etc/letsencrypt/live/amoghconnect.com -> $NEWEST_CERT_PATH"
                    fi
                    CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
                  else
                    echo "❌ No valid certificate found after expansion"
                    exit 1
                  fi
                  
                  # Verify certificate includes api subdomain
                  if [ -n "$CERT_PATH" ] && [ -f "$CERT_PATH/fullchain.pem" ]; then
                    CERT_DOMAINS=$(sudo openssl x509 -in "$CERT_PATH/fullchain.pem" -text -noout 2>/dev/null | grep -E "DNS:|Subject Alternative Name" -A 10 | grep -oE "DNS:[^,]*" | sed 's/DNS://g' | tr '\n' ' ')
                    CERT_EXPIRY_FINAL=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if echo "$CERT_DOMAINS" | grep -q "api.amoghconnect.com"; then
                      API_SUBDOMAIN_IN_CERT=true
                      SSL_CERT_EXISTS=true
                      echo "✅ Certificate verified - includes api.amoghconnect.com (expires: $CERT_EXPIRY_FINAL)"
                      echo "   Certificate includes domains: $CERT_DOMAINS"
                    else
                      echo "❌ CRITICAL: Certificate obtained but doesn't include api.amoghconnect.com"
                      echo "   Certificate domains found: $CERT_DOMAINS"
                      echo "   This will cause SSL errors. Retrying certificate acquisition..."
                      exit 1
                    fi
                  fi
                else
                  echo "❌ CRITICAL: Failed to get certificate for api subdomain"
                  CERTBOT_ERROR=$(cat /tmp/certbot.log | grep -i "error\|failed" | head -5)
                  echo "   Error details: $CERTBOT_ERROR"
                  echo "   This will cause SSL errors. Please check DNS and try again."
                  # Start nginx anyway
                  sudo systemctl start nginx
                  exit 1
                fi
                
                # Start nginx
                sudo systemctl start nginx
              else
                echo "❌ CRITICAL: Certbot not installed - cannot get certificate for API subdomain"
                exit 1
              fi
            fi
            
            # If no certificate exists at all, or certificate is expired, try to get/renew one
            if [ "$SSL_CERT_EXISTS" = false ]; then
              echo "🔧 No valid certificate found (or expired) - obtaining new certificate for both domains..."
              if command -v certbot >/dev/null 2>&1; then
                sudo systemctl stop nginx
                # Use --expand to expand existing certificate if it exists
                if sudo certbot certonly --standalone -d amoghconnect.com -d api.amoghconnect.com --non-interactive --agree-tos --register-unsafely-without-email --expand 2>&1 | tee /tmp/certbot.log; then
                  echo "✅ Successfully obtained certificate for both domains"
                  
                  # Find the newest/valid certificate (check both paths)
                  NEWEST_CERT_PATH=""
                  NEWEST_CERT_EXPIRY=0
                  CURRENT_EPOCH=$(date +%s)
                  
                  # Check standard path
                  if [ -f "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" ]; then
                    CERT_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if [ -n "$CERT_EXPIRY_STR" ]; then
                      CERT_EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                      if [ "$CERT_EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ] && [ "$CERT_EXPIRY_EPOCH" -gt "$NEWEST_CERT_EXPIRY" ]; then
                        NEWEST_CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
                        NEWEST_CERT_EXPIRY=$CERT_EXPIRY_EPOCH
                        echo "   Found valid certificate at standard path (expires: $CERT_EXPIRY_STR)"
                      fi
                    fi
                  fi
                  
                  # Check -0001 path
                  if [ -f "/etc/letsencrypt/live/amoghconnect.com-0001/fullchain.pem" ]; then
                    CERT_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com-0001/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if [ -n "$CERT_EXPIRY_STR" ]; then
                      CERT_EXPIRY_EPOCH=$(date -d "$CERT_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                      if [ "$CERT_EXPIRY_EPOCH" -gt "$CURRENT_EPOCH" ] && [ "$CERT_EXPIRY_EPOCH" -gt "$NEWEST_CERT_EXPIRY" ]; then
                        NEWEST_CERT_PATH="/etc/letsencrypt/live/amoghconnect.com-0001"
                        NEWEST_CERT_EXPIRY=$CERT_EXPIRY_EPOCH
                        echo "   Found valid certificate at -0001 path (expires: $CERT_EXPIRY_STR)"
                      fi
                    fi
                  fi
                  
                  # Set up symlink to point to the newest valid certificate
                  if [ -n "$NEWEST_CERT_PATH" ]; then
                    if [ "$NEWEST_CERT_PATH" != "/etc/letsencrypt/live/amoghconnect.com" ]; then
                      # Remove old directory if it's a symlink or contains expired certificate
                      if [ -L "/etc/letsencrypt/live/amoghconnect.com" ]; then
                        sudo rm -f /etc/letsencrypt/live/amoghconnect.com
                      elif [ -d "/etc/letsencrypt/live/amoghconnect.com" ]; then
                        if [ -f "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" ]; then
                          OLD_EXPIRY_STR=$(sudo openssl x509 -enddate -noout -in "/etc/letsencrypt/live/amoghconnect.com/fullchain.pem" 2>/dev/null | cut -d= -f2)
                          OLD_EXPIRY_EPOCH=$(date -d "$OLD_EXPIRY_STR" +%s 2>/dev/null || echo "0")
                          if [ "$OLD_EXPIRY_EPOCH" -lt "$CURRENT_EPOCH" ]; then
                            echo "   Removing old expired certificate directory..."
                            sudo rm -rf /etc/letsencrypt/live/amoghconnect.com
                          fi
                        fi
                      fi
                      # Create symlink to newest certificate
                      sudo ln -sf "$NEWEST_CERT_PATH" /etc/letsencrypt/live/amoghconnect.com
                      echo "   Created symlink: /etc/letsencrypt/live/amoghconnect.com -> $NEWEST_CERT_PATH"
                    fi
                    CERT_PATH="/etc/letsencrypt/live/amoghconnect.com"
                  else
                    echo "❌ No valid certificate found after expansion"
                    exit 1
                  fi
                  
                  # Verify certificate includes api subdomain
                  if [ -n "$CERT_PATH" ] && [ -f "$CERT_PATH/fullchain.pem" ]; then
                    CERT_DOMAINS=$(sudo openssl x509 -in "$CERT_PATH/fullchain.pem" -text -noout 2>/dev/null | grep -E "DNS:|Subject Alternative Name" -A 10 | grep -oE "DNS:[^,]*" | sed 's/DNS://g' | tr '\n' ' ')
                    CERT_EXPIRY_FINAL=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH/fullchain.pem" 2>/dev/null | cut -d= -f2)
                    if echo "$CERT_DOMAINS" | grep -q "api.amoghconnect.com"; then
                      API_SUBDOMAIN_IN_CERT=true
                      SSL_CERT_EXISTS=true
                      echo "✅ Certificate verified - includes api.amoghconnect.com (expires: $CERT_EXPIRY_FINAL)"
                      echo "   Certificate includes domains: $CERT_DOMAINS"
                    else
                      echo "❌ CRITICAL: Certificate obtained but doesn't include api.amoghconnect.com"
                      echo "   Certificate domains found: $CERT_DOMAINS"
                      echo "   This will cause SSL errors. Retrying certificate acquisition..."
                      exit 1
                    fi
                  fi
                else
                  echo "❌ CRITICAL: Failed to obtain certificate"
                  sudo systemctl start nginx
                  exit 1
                fi
                sudo systemctl start nginx
              else
                echo "❌ CRITICAL: Certbot not installed"
                exit 1
              fi
            fi
            
            # Configure nginx based on SSL availability
            if [ "$SSL_CERT_EXISTS" = true ]; then
              echo "🔒 Configuring nginx with HTTPS..."
            sudo tee /etc/nginx/sites-available/default > /dev/null << 'EOF'
            # Block direct IP access
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                return 444;
            }
            
            # Redirect HTTP to HTTPS
            server {
                listen 80;
                listen [::]:80;
                server_name amoghconnect.com;
                return 301 https://$server_name$request_uri;
            }
            
            # Main HTTPS server
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name amoghconnect.com;
                
                # SSL Configuration
                ssl_certificate /etc/letsencrypt/live/amoghconnect.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/amoghconnect.com/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
                ssl_prefer_server_ciphers off;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 10m;
                
                root /var/www/html/Frontend/dist;
                index index.html index.htm;
                
                # Handle all routes for SPA
                location / {
                    try_files $uri $uri/ /index.html;
                }
                
                # Cache control for index.html
                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                    add_header Pragma "no-cache" always;
                    add_header Expires "0" always;
                }
                
                # Cache static assets
                location /assets/ {
                    expires 1h;
                    add_header Cache-Control "public, max-age=3600";
                }
                
                # Cache other static files
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4|woff|woff2|ttf|eot)$ {
                    expires 1h;
                    add_header Cache-Control "public, max-age=3600";
                }
                
                # Handle 404 errors
                error_page 404 /index.html;
            }
            EOF
            else
              echo "🔓 Configuring nginx with HTTP only (SSL certificate not available)..."
              sudo tee /etc/nginx/sites-available/default > /dev/null << 'EOF'
            # Block direct IP access
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                return 444;
            }
            
            # Main HTTP server
            server {
                listen 80;
                listen [::]:80;
                server_name amoghconnect.com;
                root /var/www/html/Frontend/dist;
                index index.html index.htm;
                
                # Handle all routes for SPA
                location / {
                    try_files $uri $uri/ /index.html;
                }
                
                # Cache control for index.html
                location = /index.html {
                    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                    add_header Pragma "no-cache" always;
                    add_header Expires "0" always;
                }
                
                # Cache static assets
                location /assets/ {
                    expires 1h;
                    add_header Cache-Control "public, max-age=3600";
                }
                
                # Cache other static files
                location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4|woff|woff2|ttf|eot)$ {
                    expires 1h;
                    add_header Cache-Control "public, max-age=3600";
                }
                
                # Handle 404 errors
                error_page 404 /index.html;
            }
            EOF
            fi
            
            # Configure API subdomain - ALWAYS HTTPS (certificate must include api subdomain)
            if [ "$SSL_CERT_EXISTS" = true ] && [ "$API_SUBDOMAIN_IN_CERT" = true ]; then
              echo "🔒 Configuring API subdomain with HTTPS (proxy to AWS backend)..."
              sudo tee /etc/nginx/sites-available/api.amoghconnect.com > /dev/null << 'EOF'
            # API subdomain configuration - HTTPS proxy to AWS backend
            server {
                listen 80;
                listen [::]:80;
                server_name api.amoghconnect.com;
                return 301 https://$server_name$request_uri;
            }
            
            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name api.amoghconnect.com;
                
                # SSL Configuration
                ssl_certificate /etc/letsencrypt/live/amoghconnect.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/amoghconnect.com/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;
                ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
                ssl_prefer_server_ciphers off;
                ssl_session_cache shared:SSL:10m;
                ssl_session_timeout 10m;
                
                # Proxy to backend API on AWS
                location / {
                    # Remove backend CORS headers to avoid conflicts, then add our own
                    proxy_hide_header Access-Control-Allow-Origin;
                    proxy_hide_header Access-Control-Allow-Methods;
                    proxy_hide_header Access-Control-Allow-Headers;
                    proxy_hide_header Access-Control-Allow-Credentials;
                    
                    proxy_pass http://13.235.148.91:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_cache_bypass $http_upgrade;
                    proxy_read_timeout 86400;
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_buffering off;
                    
                    # Handle CORS preflight requests
                    if ($request_method = OPTIONS) {
                        add_header Access-Control-Allow-Origin * always;
                        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                        add_header Access-Control-Allow-Credentials true always;
                        add_header Access-Control-Max-Age 86400 always;
                        add_header Content-Type 'text/plain' always;
                        add_header Content-Length 0 always;
                        return 204;
                    }
                    
                    # CORS headers for actual requests
                    add_header Access-Control-Allow-Origin * always;
                    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
                    add_header Access-Control-Allow-Credentials true always;
                    add_header Access-Control-Expose-Headers "Content-Length, Content-Type, ETag" always;
                }
            }
            EOF
            else
              echo "❌ CRITICAL: Cannot configure API subdomain - certificate must include api.amoghconnect.com"
              exit 1
            fi
            
            # Enable API subdomain
            sudo ln -sf /etc/nginx/sites-available/api.amoghconnect.com /etc/nginx/sites-enabled/
            
            # Test nginx configuration
            if sudo nginx -t; then
              echo "✅ Nginx configuration is valid"
              
              # Verify certificate file exists and is valid before reloading
              if [ "$SSL_CERT_EXISTS" = true ] && [ -n "$CERT_PATH" ]; then
                echo "Verifying certificate before reloading nginx..."
                if [ -f "$CERT_PATH/fullchain.pem" ] && [ -f "$CERT_PATH/privkey.pem" ]; then
                  CERT_EXPIRY_CHECK=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH/fullchain.pem" 2>/dev/null | cut -d= -f2)
                  CERT_EXPIRY_EPOCH_CHECK=$(date -d "$CERT_EXPIRY_CHECK" +%s 2>/dev/null || echo "0")
                  CURRENT_EPOCH_CHECK=$(date +%s)
                  if [ "$CERT_EXPIRY_EPOCH_CHECK" -gt "$CURRENT_EPOCH_CHECK" ]; then
                    echo "✅ Certificate is valid (expires: $CERT_EXPIRY_CHECK)"
                  else
                    echo "❌ Certificate at $CERT_PATH is expired (expired: $CERT_EXPIRY_CHECK)"
                    exit 1
                  fi
                else
                  echo "❌ Certificate files not found at $CERT_PATH"
                  exit 1
                fi
              fi
              
            sudo systemctl reload nginx
              echo "✅ Nginx reloaded"
              
              # Wait a moment for nginx to fully reload
              sleep 2
            else
              echo "❌ Nginx configuration failed"
              sudo nginx -t
              exit 1
            fi
            
            # Wait for nginx to fully reload and verify it's listening
            sleep 5
            echo "Checking nginx status..."
            sudo systemctl status nginx --no-pager | head -10
            
            # Verify nginx is listening on required ports
            echo "Checking listening ports..."
            sudo netstat -tulnp | grep nginx || sudo ss -tulnp | grep nginx
            
            # Test the website based on SSL availability (with retries)
            MAX_RETRIES=3
            RETRY_COUNT=0
            WEBSITE_RESPONSE="000"
            
            if [ "$SSL_CERT_EXISTS" = true ]; then
              echo "Testing website with HTTPS (with retries)..."
              while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ] && [ "$WEBSITE_RESPONSE" != "200" ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."
            sleep 2
                WEBSITE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://amoghconnect.com || echo "000")
                echo "HTTPS Response Code: $WEBSITE_RESPONSE"
              done
            else
              echo "Testing website with HTTP..."
              WEBSITE_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://amoghconnect.com || echo "000")
              echo "HTTP Response Code: $WEBSITE_RESPONSE"
            fi
            
            if [ "$WEBSITE_RESPONSE" = "200" ]; then
              echo "✅ Website is working correctly"
            else
              echo "⚠️ Website test returned status: $WEBSITE_RESPONSE"
              echo "Checking nginx error logs..."
              sudo tail -20 /var/log/nginx/error.log
              echo "Checking nginx access logs..."
              sudo tail -10 /var/log/nginx/access.log || echo "No access log entries"
              echo "Checking if nginx is listening on port 443..."
              sudo netstat -tulnp | grep :443 || sudo ss -tulnp | grep :443
              echo "Checking certificate file exists..."
              ls -la /etc/letsencrypt/live/amoghconnect.com/fullchain.pem || echo "Certificate file not found"
              echo "Testing HTTPS connection directly..."
              curl -v --max-time 10 https://amoghconnect.com 2>&1 | head -30 || echo "Curl test failed"
              # Don't exit on test failure - might be temporary DNS/network issue
              echo "⚠️ Website test had issues but deployment completed. Please verify manually."
            fi
            
            # Test API subdomain - Always HTTPS
            echo "Testing API subdomain with HTTPS..."
            API_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.amoghconnect.com/api/test)
            echo "HTTPS API Response Code: $API_RESPONSE"
            
            if [ "$API_RESPONSE" = "200" ]; then
              echo "✅ API subdomain is working correctly"
            else
              echo "⚠️ API subdomain test failed (Status: $API_RESPONSE)"
              echo "This might be due to DNS propagation delay"
            fi
            
            # Update frontend API configuration - Always HTTPS
            echo "📝 Updating frontend API configuration to use HTTPS..."
            # Update built JavaScript files to use HTTPS (handle various formats)
            find /var/www/html/Frontend/dist/assets -name "*.js" -type f | while read file; do
              sed -i 's|http://api\.amoghconnect\.com|https://api.amoghconnect.com|g' "$file"
              sed -i "s|'http://api\.amoghconnect\.com'|'https://api.amoghconnect.com'|g" "$file"
              sed -i 's|"http://api\.amoghconnect\.com"|"https://api.amoghconnect.com"|g' "$file"
              sed -i 's|http:\\/\\/api\.amoghconnect\.com|https://api.amoghconnect.com|g' "$file"
            done
            echo "✅ Frontend API configuration updated to HTTPS"
            
            # Setup automatic certificate renewal - Works independently of CI/CD
            if command -v certbot >/dev/null 2>&1 && [ "$SSL_CERT_EXISTS" = true ]; then
              echo "🔧 Setting up automatic certificate renewal (independent of CI/CD)..."
              
              # Create renewal hook to reload nginx after certificate renewal
              sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
              echo '#!/bin/bash' | sudo tee /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo '# Auto-renewal hook - Reloads nginx after certificate renewal' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo '# This runs automatically when certbot renews certificates (twice daily check)' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo '' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo 'echo "Certificate renewed - Reloading nginx..."' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo 'systemctl reload nginx' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              echo 'echo "Nginx reloaded successfully"' | sudo tee -a /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh > /dev/null
              sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
              echo "✅ Auto-renewal hook created"
              
              # Ensure certbot renewal timer is enabled and active
              if systemctl list-unit-files | grep -q certbot.timer; then
                sudo systemctl enable certbot.timer
                sudo systemctl start certbot.timer
                echo "✅ Certbot timer enabled and started"
              else
                echo "⚠️ Certbot timer not found - renewal will run via cron"
              fi
              
              # Set up cron job as backup (runs twice daily at 3 AM and 3 PM)
              CRON_JOB="0 3,15 * * * /usr/bin/certbot renew --quiet --deploy-hook /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh"
              if ! crontab -l 2>/dev/null | grep -q "certbot renew"; then
                (crontab -l 2>/dev/null; echo "$CRON_JOB") | sudo crontab -
                echo "✅ Cron job added for certificate renewal"
              else
                echo "✅ Cron job already exists for certificate renewal"
              fi
              
              # Test renewal (dry run)
              echo "Testing certificate renewal (dry run)..."
              if sudo certbot renew --dry-run --deploy-hook /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh >/dev/null 2>&1; then
                echo "✅ Certificate auto-renewal test passed"
              else
                echo "⚠️ Certificate auto-renewal test had issues (check manually with: certbot renew --dry-run)"
              fi
              
              # Show renewal status
              echo ""
              echo "📋 Certificate Renewal Status:"
              echo "   - Renewal hook: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh"
              if systemctl is-active --quiet certbot.timer; then
                echo "   - Certbot timer: Active"
                systemctl status certbot.timer --no-pager -l | grep -E "Active|Trigger" | head -2
              else
                echo "   - Certbot timer: Not active (using cron instead)"
              fi
              echo "   - Cron job: Runs at 3 AM and 3 PM daily"
              echo "   - Next renewal: Certificates auto-renew when < 30 days until expiry"
              echo ""
            else
              echo "⚠️ Certbot not found - automatic renewal not configured"
            fi
            
            echo "🎉 Frontend deployment completed successfully!" 